[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vjev"
version = "0.1.0"
description = "Open, Jev-style typed decisions about images: calibrated choice, score, yes/no and abstaining boxes from a vision-language model's token probabilities"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.24", "pillow>=9"]

[project.optional-dependencies]
model = ["torch>=2.1", "transformers>=4.49", "accelerate"]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["vjev*"]

[tool.setuptools.package-data]
vjev = ["calibration/*.json"]
